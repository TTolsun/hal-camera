<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <style>body{max-width:1100px;margin:0 auto;padding:24px;font:16px/1.7 system-ui,sans-serif;color:#172033}nav{display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:16px}a{color:#1459a6}pre{overflow:auto;background:#f4f6f8;padding:16px}table{border-collapse:collapse;display:block;overflow:auto}th,td{border:1px solid #ddd;padding:8px;text-align:left}sub{font-size:.8rem}.mermaid{overflow:auto}h2,h3{margin-top:2em}</style>
</head>
<body>
  <nav aria-label="문서 메뉴">
    <a href="{{ '/' | relative_url }}">소개</a>
    <a href="{{ '/getting-started.html' | relative_url }}">빠른 시작</a>
    <a href="{{ '/architecture.html' | relative_url }}">아키텍처</a>
    <a href="{{ '/troubleshooting.html' | relative_url }}">디버깅</a>
  </nav>
  <main>{{ content }}</main>
  <script type="module">
    const blocks = [...document.querySelectorAll('pre > code.language-mermaid')];
    if (blocks.length) {
      try {
        const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs');
        mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
        const nodes = blocks.map(code => {
          const node = document.createElement('div');
          node.className = 'mermaid';
          node.textContent = code.textContent;
          code.parentElement.replaceWith(node);
          return node;
        });
        await mermaid.run({ nodes });
      } catch (error) {
        console.error('Mermaid rendering failed', error);
      }
    }
  </script>
</body>
</html>

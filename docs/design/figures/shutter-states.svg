<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96" role="img" font-family="Inter, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title>셔터의 세 가지 상태</title>
  <desc>사진 모드는 흰 원, 동영상 모드는 흰 테두리 안의 빨간 원, 녹화 중에는 흰 테두리 안의 빨간 정지 사각형이다.</desc>
  <rect width="320" height="96" rx="8" fill="#ffffff"/>
  <rect x="38" y="8" width="56" height="56" rx="8" fill="#18191b"/>
  <circle cx="66" cy="36" r="22" fill="#ffffff"/>
  <rect x="132" y="8" width="56" height="56" rx="8" fill="#18191b"/>
  <circle cx="160" cy="36" r="22" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="160" cy="36" r="16" fill="#ff3b30"/>
  <rect x="226" y="8" width="56" height="56" rx="8" fill="#18191b"/>
  <circle cx="254" cy="36" r="22" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="245" y="27" width="18" height="18" rx="4" fill="#ff3b30"/>
  <g font-size="12" fill="#62666d" text-anchor="middle">
    <text x="66" y="84">사진</text>
    <text x="160" y="84">동영상</text>
    <text x="254" y="84">녹화 중</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" role="img" font-family="Inter, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title>Live 화면의 영역 배치 개념도</title>
  <desc>위에서 아래로 상단 막대, 프리뷰, 측정 두 줄, 줌, 셔터 행, 모드, Mark 행의 일곱 영역과 셔터의 세 가지 상태를 보여준다.</desc>
  <rect width="680" height="610" rx="8" fill="#ffffff"/>

  <!-- Phone -->
  <rect x="43" y="33" width="254" height="534" rx="26" fill="#000000" stroke="#2a2b2e" stroke-width="6"/>

  <!-- 1 Top bar -->
  <text x="58" y="60" font-size="12" fill="#ffffff">Camera2</text>
  <text x="152" y="60" font-size="11" fill="#bdc1c7" text-anchor="middle">Camera · 0 · Live</text>
  <text x="264" y="60" font-size="12" fill="#ffffff" text-anchor="end">도구  진단</text>

  <!-- 2 Preview -->
  <text x="170" y="218" font-size="12" fill="#62666d" text-anchor="middle">카메라 프리뷰</text>

  <!-- 3 Measurement lines -->
  <text x="58" y="367" font-size="11" fill="#ffffff" font-family="ui-monospace, Consolas, monospace">30.0 fps · ISO 100 · 1/60 s</text>
  <text x="58" y="382" font-size="11" fill="#ffffff" font-family="ui-monospace, Consolas, monospace">AF 0.42 dpt · zoom 1.0×</text>

  <!-- 4 Zoom -->
  <circle cx="170" cy="408" r="16" fill="#ffffff"/>
  <text x="170" y="412" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">1×</text>

  <!-- 5 Shutter row -->
  <circle cx="92" cy="466" r="22" fill="#3a3b3f"/>
  <circle cx="170" cy="466" r="31" fill="#ffffff"/>
  <circle cx="248" cy="466" r="22" fill="#202124"/>
  <rect x="238" y="460" width="20" height="14" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="248" cy="467" r="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- 6 Mode -->
  <text x="152" y="520" font-size="12" fill="#ffffff" text-anchor="middle">사진</text>
  <text x="196" y="520" font-size="12" fill="#888780" text-anchor="middle">동영상</text>

  <!-- 7 Mark row -->
  <line x1="46" y1="530" x2="294" y2="530" stroke="#202124"/>
  <text x="170" y="551" font-size="12" fill="#ffffff" text-anchor="middle">Mark · ZIP 저장</text>

  <!-- Markers -->
  <g font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
    <circle cx="284" cy="56" r="8" fill="#0066cc"/><text x="284" y="60">1</text>
    <circle cx="284" cy="214" r="8" fill="#0066cc"/><text x="284" y="218">2</text>
    <circle cx="284" cy="374" r="8" fill="#0066cc"/><text x="284" y="378">3</text>
    <circle cx="284" cy="408" r="8" fill="#0066cc"/><text x="284" y="412">4</text>
    <circle cx="284" cy="440" r="8" fill="#0066cc"/><text x="284" y="444">5</text>
    <circle cx="284" cy="516" r="8" fill="#0066cc"/><text x="284" y="520">6</text>
    <circle cx="284" cy="547" r="8" fill="#0066cc"/><text x="284" y="551">7</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#62666d">
    <circle cx="352" cy="42" r="9" fill="#0066cc"/><text x="352" y="46" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">1</text>
    <text x="370" y="47" font-size="14" font-weight="600" fill="#18191b">상단 막대</text>
    <text x="370" y="65">API 버튼(누를 때마다 Camera2↔CameraX)</text>
    <text x="370" y="81">카메라 이름·상태, 도구, 진단</text>

    <circle cx="352" cy="102" r="9" fill="#0066cc"/><text x="352" y="106" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">2</text>
    <text x="370" y="107" font-size="14" font-weight="600" fill="#18191b">프리뷰</text>
    <text x="370" y="125">검은 배경에 영상을 최대한 넓게 표시</text>
    <text x="370" y="141">영상을 가리는 타일과 상시 그래프를 두지 않음</text>

    <circle cx="352" cy="162" r="9" fill="#0066cc"/><text x="352" y="166" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">3</text>
    <text x="370" y="167" font-size="14" font-weight="600" fill="#18191b">측정 두 줄</text>
    <text x="370" y="185">FPS · ISO · 노출 · 초점 · 적용 줌</text>
    <text x="370" y="201">프레임 간격 그래프는 진단 패널에서 제공</text>

    <circle cx="352" cy="222" r="9" fill="#0066cc"/><text x="352" y="226" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">4</text>
    <text x="370" y="227" font-size="14" font-weight="600" fill="#18191b">줌</text>
    <text x="370" y="245">현재 배율만 보이다가 누르면 지원 배율로 펼쳐짐</text>
    <text x="370" y="261">마지막 조작 3초 뒤 선택한 배율로 접힘</text>

    <circle cx="352" cy="282" r="9" fill="#0066cc"/><text x="352" y="286" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">5</text>
    <text x="370" y="287" font-size="14" font-weight="600" fill="#18191b">셔터 행</text>
    <text x="370" y="305">최근 촬영물 썸네일 · 셔터 · 카메라 선택</text>
    <text x="370" y="321">세 버튼의 중심선을 맞춤</text>

    <circle cx="352" cy="342" r="9" fill="#0066cc"/><text x="352" y="346" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">6</text>
    <text x="370" y="347" font-size="14" font-weight="600" fill="#18191b">모드</text>
    <text x="370" y="365">사진 · 동영상, 누르면 설정만 바뀜</text>
    <text x="370" y="381">녹화 중에는 이 자리에 경과 시간을 표시</text>

    <circle cx="352" cy="402" r="9" fill="#0066cc"/><text x="352" y="406" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">7</text>
    <text x="370" y="407" font-size="14" font-weight="600" fill="#18191b">Mark 행</text>
    <text x="370" y="425">직전 10초와 이후 5초를 incident ZIP으로 저장</text>
    <text x="370" y="441">진단 패널을 열어도 위치를 유지</text>
  </g>

  <!-- Shutter states -->
  <text x="344" y="480" font-size="14" font-weight="600" fill="#18191b">셔터 상태</text>
  <rect x="368" y="490" width="44" height="44" rx="6" fill="#18191b"/>
  <circle cx="390" cy="512" r="17" fill="#ffffff"/>
  <rect x="468" y="490" width="44" height="44" rx="6" fill="#18191b"/>
  <circle cx="490" cy="512" r="17" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="490" cy="512" r="12" fill="#ff3b30"/>
  <rect x="568" y="490" width="44" height="44" rx="6" fill="#18191b"/>
  <circle cx="590" cy="512" r="17" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="583" y="505" width="14" height="14" rx="3" fill="#ff3b30"/>
  <g font-size="12" fill="#62666d" text-anchor="middle">
    <text x="390" y="552">사진</text>
    <text x="490" y="552">동영상</text>
    <text x="590" y="552">녹화 중</text>
  </g>

  <text x="40" y="594" font-size="12" fill="#62666d">개념도입니다. 기기 화면 캡처가 아니며 측정 수치는 예시입니다.</text>
</svg>

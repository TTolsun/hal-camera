# 개발자 가이드 검사.
#
# 로컬 진입점 `node tools/docgen/docflow.mjs check` 와 같은 단계를 같은 순서로 실행합니다. 파이프라인은 공용 엔진
# @ttolsun/omm-doc-workflow(tools/docgen/package.json 에 고정)이고, 이 저장소에는 설정과 어댑터만 있습니다.
#   원본 최신성: 관련 코드가 바뀌었는데 .omm/ 이나 원고의 검토가 빠졌는가  (verify --check)
#   생성 일치:   .omm/ 과 바인딩에서 만든 결과가 guide/ 와 같은가          (generate --check)
#   사이트 일치: guide/ 에서 빌드한 정적 사이트가 커밋된 docs/ 와 같은가     (site check)
# 추출기와 검증기가 쓰는 state/ 파일이 커밋된 것과 다르면 그것도 실패입니다.
#
# 이 워크플로는 공개 저장소의 PR 검사용입니다. 배포는 main 의 /docs 를 "Deploy from a branch" 로
# 제공하므로 Actions 가 없는 사내 미러에서도 같은 산출물을 그대로 씁니다.
name: docs-check

on:
  pull_request:
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/docs-check.yml"
      - ".omm/**"
      - "guide/**"
      - "docs/**"
      - "tools/docgen/**"
      - "tools/halcam/**"
  push:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 문서 엔진 설치
        # npm 은 GitHub git 의존성을 lock 에 git+ssh 로 기록합니다. 러너에는 SSH 키가 없으므로 HTTPS 로 받습니다.
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --prefix tools/docgen --ignore-scripts
      - name: 저장소 회귀 검사
        run: npm test --prefix tools/docgen
      - name: 문서 검사 (로컬 진입점과 동일)
        run: node tools/docgen/docflow.mjs check --ci

# 개발자 가이드 검사.
#
# 로컬 진입점 tools/docgen/docs-check.mjs 와 같은 단계를 같은 순서로 실행합니다.
#   원본 최신성: 관련 코드가 바뀌었는데 .omm/ 이나 원고의 검토가 빠졌는가  (verify --check)
#   생성 일치:   .omm/ 과 바인딩에서 만든 결과가 guide/ 와 같은가          (generate --check)
#   사이트 일치: guide/ 에서 빌드한 정적 사이트가 커밋된 docs/ 와 같은가     (site check)
# 추출기와 검증기가 쓰는 state/ 파일이 커밋된 것과 다르면 그것도 실패입니다.
#
# 이 워크플로는 공개 저장소의 PR 검사용입니다. 배포는 main 의 /docs 를 "Deploy from a branch" 로
# 제공하므로 Actions 가 없는 사내 미러에서도 같은 산출물을 그대로 씁니다.
name: docs-check

on:
  pull_request:
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/docs-check.yml"
      - ".omm/**"
      - "guide/**"
      - "docs/**"
      - "tools/docgen/**"
      - "tools/halcam/**"
  push:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 문서 검사 (로컬 진입점과 동일)
        run: node tools/docgen/docs-check.mjs --ci

# 개발자 가이드 검사.
#
# 두 가지를 확인합니다.
#   원본 최신성: 관련 코드가 바뀌었는데 .omm/ 이나 원고의 검토가 빠졌는가  (verify --check)
#   생성 일치:   .omm/ 과 바인딩에서 만든 결과가 docs/guide 와 같은가        (generate --check)
# 추출기와 검증기가 쓰는 state/ 파일이 커밋된 것과 다르면 그것도 실패입니다.
#
# 생성기에는 외부 의존성이 없습니다. 복구 검사는 고정된 OMM CLI를 사용합니다.
name: docs-check

on:
  pull_request:
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/docs-check.yml"
      - ".omm/**"
      - "docs/guide/**"
      - "tools/docgen/**"
      - "tools/halcam/**"
  push:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 파이프라인 회귀 검사
        run: node --test tools/docgen/regression.test.mjs tools/docgen/design.test.mjs
      - name: 동기화 검사 의존성 설치
        run: npm ci --prefix tools/docgen --ignore-scripts
      - name: 동기화 실패 복구 검사 (모델 호출 없음)
        run: node --test tools/docgen/sync.test.mjs
      - name: 디자인 생성 결과 일치 검사
        run: node tools/docgen/common.mjs design --check
      - name: 사실 추출
        run: node tools/docgen/extract.mjs
      - name: 원본 최신성 검사
        run: node tools/docgen/verify.mjs --check
      - name: 생성 결과 일치 검사
        run: node tools/docgen/generate.mjs --check
      - name: 상태 파일 일치 검사
        run: git diff --exit-code -- tools/docgen/state docs/guide

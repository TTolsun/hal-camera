# Optional: enable only after registering a trusted local runner with Ollama/Qwen.
# Ordinary GitHub-hosted runners cannot reach the developer's localhost.
name: docs-sync

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rescan all elements and rewrite all manuscripts'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.omm/**'
      - 'guide/_bindings.yaml'
      - 'tools/docgen/**'
      - '.github/workflows/docs-sync.yml'

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'TTolsun/hal-camera' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DOCGEN_LOCAL_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, docgen-qwen]
    timeout-minutes: 45
    defaults:
      run:
        # A new service account has no per-user PowerShell policy or pwsh PATH.
        # Limit script execution to this process; do not change machine policy.
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 문서 엔진 설치
        # npm 은 GitHub git 의존성을 lock 에 git+ssh 로 기록합니다. 러너에는 SSH 키가 없으므로 HTTPS 로 받습니다.
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --prefix tools/docgen --ignore-scripts
      - name: 로컬 Qwen 동기화
        env:
          DOCGEN_OLLAMA_URL: http://127.0.0.1:11434
          DOCGEN_QWEN_MODEL: qwen3.5:4b
          DOCGEN_QWEN_CONTEXT: '49152'
          DOCGEN_LLM_TIMEOUT_MS: '1800000'
          DOCGEN_FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          $syncArgs = @()
          if ($env:DOCGEN_FORCE -eq 'true') { $syncArgs += '--force' }
          node tools/docgen/docflow.mjs sync @syncArgs
      - name: 변경 여부 확인
        # create-pull-request 는 변경이 없으면 기존 PR 브랜치를 base 로 되돌립니다. 재스캔 대상이 없는 실행이
        # 앞선 실행의 자동 PR 을 비우지 않도록, 실제 변경(줄끝만 다른 파일 제외)이 있을 때만 PR 단계를 실행합니다.
        id: changes
        run: |
          git diff --quiet
          $modified = $LASTEXITCODE -ne 0
          $untracked = (git ls-files --others --exclude-standard | Measure-Object).Count -gt 0
          $changed = ($modified -or $untracked).ToString().ToLower()
          Write-Output "changed=$changed"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "changed=$changed"
      - name: 재검토용 PR 본문
        # qwen3.5:4b 는 코드의 값 변경을 놓친 채 형식 검사만 통과할 수 있습니다(2026-09-25 시험). 검토자가 원본을 코드와
        # 직접 대조하도록, 검토 이후 바뀐 근거 코드를 PR 본문에 싣습니다. --dry-run 이라 작업본을 바꾸지 않습니다.
        if: steps.changes.outputs.changed == 'true'
        env:
          # 문구는 모두 env 에 둡니다. run 은 BOM 없는 .ps1 로 Windows PowerShell 5.1 이 읽으므로 한글 리터럴이 깨질 수 있고,
          # workflow.test.mjs 는 자동 경로의 run 에 검토 기록 명령이 없는지 검사합니다.
          BODY_INTRO: |
            로컬 Qwen 동기화 결과입니다. 구조와 원고를 코드에 대조해 검토하세요.
            로컬 모델은 코드의 값 변경을 놓친 채 형식 검사만 통과할 수 있으므로, 아래 diff 와 원본의 값·조건·순서를 직접 대조합니다.
            검토 후 `node tools/docgen/docflow.mjs verify --accept --reviewer=이름`으로 기록하고
            `node tools/docgen/docflow.mjs generate`로 페이지를, `node tools/docgen/docflow.mjs site build`로 docs/ 산출물을
            다시 생성한 뒤 함께 커밋하세요.
          BODY_SUMMARY: 검토 이후 바뀐 근거 코드 (verify --changes)
          BODY_CLIPPED: … (PR 본문 한도 때문에 생략했습니다. 로컬에서 verify --changes 로 전체를 확인하세요)
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $changes = (node tools/docgen/docflow.mjs verify --changes --dry-run | Out-String).Trim()
          $limit = 50000
          if ($changes.Length -gt $limit) { $changes = $changes.Substring(0, $limit) + "`n" + $env:BODY_CLIPPED }
          $fence = '```'
          $body = @(
            $env:BODY_INTRO.Trim()
            ''
            "<details><summary>$($env:BODY_SUMMARY)</summary>"
            ''
            "${fence}diff"
            $changes
            $fence
            '</details>'
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'omm-sync-body.md'), $body, (New-Object Text.UTF8Encoding $false))
      - name: PR 생성
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/omm-sync
          title: "docs: local Qwen sync (${{ github.run_id }})"
          commit-message: "docs: sync structures and manuscripts with local Qwen"
          body-path: ${{ runner.temp }}/omm-sync-body.md
          labels: documentation

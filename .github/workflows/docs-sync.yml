# Optional: enable only after registering a trusted local runner with Ollama/Qwen.
# Ordinary GitHub-hosted runners cannot reach the developer's localhost.
name: docs-sync

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rescan all elements and rewrite all manuscripts'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.omm/**'
      - 'docs/guide/_bindings.yaml'
      - 'tools/docgen/**'
      - '.github/workflows/docs-sync.yml'

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'TTolsun/hal-camera' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DOCGEN_LOCAL_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, docgen-qwen]
    timeout-minutes: 45
    defaults:
      run:
        # A new service account has no per-user PowerShell policy or pwsh PATH.
        # Limit script execution to this process; do not change machine policy.
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: OMM CLI 설치
        run: npm ci --prefix tools/docgen --ignore-scripts
      - name: 로컬 Qwen 동기화
        env:
          DOCGEN_OLLAMA_URL: http://127.0.0.1:11434
          DOCGEN_QWEN_MODEL: qwen3.5:4b
          DOCGEN_QWEN_CONTEXT: '49152'
          DOCGEN_LLM_TIMEOUT_MS: '1800000'
          DOCGEN_FORCE: ${{ inputs.force && 'true' || 'false' }}
          DOCFLOW_ENGINE_ROOT: ${{ vars.DOCFLOW_ENGINE_ROOT }}
        run: |
          $syncArgs = @()
          if ($env:DOCGEN_FORCE -eq 'true') { $syncArgs += '--force' }
          if ($env:DOCFLOW_ENGINE_ROOT) {
            node tools/docgen/common.mjs sync @syncArgs
          } else {
            node tools/docgen/sync.mjs @syncArgs
          }
      - name: PR 생성
        uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/omm-sync
          title: "docs: local Qwen sync (${{ github.run_id }})"
          commit-message: "docs: sync structures and manuscripts with local Qwen"
          body: |
            로컬 Qwen 동기화 결과입니다. 구조와 원고를 코드에 대조해 검토하세요.
            검토 후 `node tools/docgen/verify.mjs --accept --reviewer=이름`으로 기록하고
            `node tools/docgen/generate.mjs`로 페이지를 다시 생성한 뒤 함께 커밋하세요.
          labels: documentation

name: CLI checks

on:
  pull_request:
    paths:
      - 'tools/halcam/**'
      - 'app/**'
      - '.github/workflows/cli-check.yml'
  push:
    branches: [main]

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ./tools/halcam
      - run: halcam --help
      - run: python -m unittest discover -s tools/halcam/tests -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew assembleDebug testDebugUnitTest lintDebug

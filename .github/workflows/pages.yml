# GitHub Pages 배포.
#
# 사이트 원본은 docs/guide 입니다. "Deploy from a branch" 는 / 또는 /docs 만 고를 수 있으므로
# Actions 기반 배포를 씁니다. 저장소 Settings > Pages 에서 Source 를 "GitHub Actions" 로 두어야 합니다.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
  pull_request:
    paths:
      - "docs/guide/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/guide
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

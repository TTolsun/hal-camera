          - app/src/main/java/dev/halcamera/cli/CliCommand.kt
          - app/src/main/java/dev/halcamera/cli/LiveController.kt
          - app/src/main/java/dev/halcamera/cli/BenchmarkController.kt
          - app/src/main/java/dev/halcamera/cli/CtsController.kt
      engine-lifecycle:
        evidence:
          - app/src/main/java/dev/halcamera/camera/Camera2Engine.kt
          - app/src/main/java/dev/halcamera/camera/CameraXEngine.kt
      runner-sequence:
        evidence:
          - app/src/main/java/dev/halcamera/benchmark/domain/BenchmarkRunner.kt
      incident-window:
        evidence:
          - app/src/main/java/dev/halcamera/telemetry/FlightRecorder.kt
      validity-gate:
        evidence:
          - app/src/main/java/dev/halcamera/benchmark/domain/RunValidity.kt
          - app/src/main/java/dev/halcamera/benchmark/domain/RegressionDetector.kt

  telemetry-facts:
    kind: fact

  build-facts:
    kind: fact

# --------------------------------------------------------------------------
# 담당 요소 검사 (coverage.mjs)
# *Activity.kt 와 dev/halcamera 바로 아래 패키지는 위 elements evidence 중 하나에 들어 있어야 합니다.
# 문서화하지 않을 것은 여기에 사유와 함께 적습니다. path 는 저장소 루트 기준이며 패키지는 끝에 / 를 붙입니다.
# --------------------------------------------------------------------------
coverage:
  ignore: []

# --------------------------------------------------------------------------
# 페이지 정의
#
# 여기 등록한 페이지만 생성기가 마커 블록을 채웁니다. benchmark.md, probe.md, cts.md, decisions.md,
# evidence.md, getting-started.md, index.md 는 손으로 쓴 요약 페이지이며 등록하지 않습니다.
# probe.md 와 cts.md 는 screens/probe-screen · screens/cts-screen 요소를 based_on 으로 묶지 않기로
# 했습니다(#87). 요소 설명은 architecture.md 원고가 담당하고, 두 페이지는 그 요약으로 남깁니다.
# 페이지를 생성 대상으로 바꾸려면 아래에 등록하고 _content/<page>/ 원고를 만듭니다.
# --------------------------------------------------------------------------
pages:
  architecture.md:
    title: 아키텍처 및 코드 구조
    blocks:
      - id: status
        kind: status

      - id: overview
        kind: content
        based_on: [overall-architecture, data-flow]
        confidence: code
        brief:
          reader: 코드를 처음 읽는 개발자와, 기능을 수정하기 전에 영향 범위를 알아야 하는 개발자
          answers:
            - 앱은 큰 틀에서 어떤 단계로 동작하며, 각 단계의 책임은 무엇인가
            - Live 관측과 벤치마크 비교는 어떻게 다르며, 이력은 어디서 여는가
            - 코드를 처음 읽을 때 어느 파일부터 열어야 하는가
          must_link: [Telemetry, FlightRecorder, RunAssembler, MainActivity]
          forbid:
            - 설계 결정의 이유를 코드만 보고 추정하지 않습니다. decisions.md 에 없으면 "확인 필요"로 남깁니다.
            - 기기에서 동작했다는 서술을 하지 않습니다.

      - id: overall-diagram
        kind: omm
        source: overall-architecture
        field: diagram
        confidence: code

      - id: module-roles
        kind: content
        based_on: [overall-architecture]
        confidence: code
        brief:
          reader: 기능을 수정할 패키지와 연결된 클래스를 찾아야 하는 개발자
          answers:
            - 각 패키지는 어떤 역할을 하며 변경 시 어떤 의존성을 확인해야 하는가
            - 실행과 평가 영역, 기록과 저장 영역은 어떻게 나뉘는가
          must_link: [CameraEngine, BenchmarkActivity, FlightRecorder]
          forbid:
            - 구조 영역과 실제 패키지를 일대일 대응으로 단정하지 않습니다.

      - id: runtime-flow
        kind: content
        based_on: [data-flow]
        confidence: code
        brief:
          reader: 화면에서 바꾼 설정이 어떤 Camera 요청과 결과로 이어지는지 추적해야 하는 HAL 개발자
          answers:
            - 사용자 조작 하나가 어떤 순서로 카메라 호출, 콜백 기록, 지표 계산, 화면 표시로 이어지는가
            - 이벤트 경로와 러너 경로가 왜 따로 있고 어디서 합쳐지는가
            - 결과가 예상과 다를 때 어느 단계의 출력을 먼저 확인해야 하는가
          must_link: [FlightRecorder, MetricExtractor, RunAssembler]
          forbid:
            - 측정값의 저장과 baseline/reference를 이용한 비교 결과 계산을 구분합니다.

      - id: runtime-diagram
        kind: omm
        source: data-flow
        field: diagram
        confidence: code

      - id: lifecycle-diagram
        kind: omm
        source: state-transitions
        field: diagram
        confidence: code

      - id: constraints
        kind: content
        based_on: [overall-architecture]
        confidence: code
        brief:
          reader: 측정 기능을 수정하면서 기존 계약을 유지해야 하는 개발자
          answers:
            - 카메라 점유와 시계 비교에서 어떤 제약을 지켜야 하는가
            - 계산 로직과 저장 경계에서 어떤 규칙을 지켜야 하는가
          must_link: [CameraEngine, RunValidity, RegressionRules]
          forbid:
            - 원본 constraint의 조건과 예외를 줄이거나 새 설계 의도를 추정하지 않습니다.

      - id: open-questions
        kind: omm-concerns
        source: overall-architecture
        confidence: intent

  troubleshooting.md:
    title: 디버깅 및 문제 해결
    blocks:
      - id: status
        kind: status

      - id: build-identity
        kind: fact
        source: build-facts
        confidence: code

      - id: log-tags
        kind: fact
        source: telemetry-facts
        confidence: code

      - id: layer-isolation
        kind: content
        based_on: [data-flow, state-transitions]
        confidence: code
        brief:
          reader: 증상이 앱, 프레임워크, HAL 중 어느 계층에서 왔는지 좁혀야 하는 HAL 개발자
          answers:
            - 앱이 기록하는 이벤트와 러너 표시 중 무엇이 프레임워크 경계 바깥의 사실이고 무엇이 앱의 해석인가
            - 세션 ID 필터링, 초기 프레임 제외, INSUFFICIENT_SAMPLES 같은 앱 쪽 규칙이 어떤 증상을 만들 수 있는가
            - 계층을 좁히기 위해 어떤 순서로 무엇을 확인하는가
          must_link: [FlightRecorder, capacityEvictions, INSUFFICIENT_SAMPLES]
          forbid:
            - 특정 기기에서 재현되었다는 서술을 하지 않습니다. device-verification.yaml 의 기록만 인용합니다.

      - id: open-questions
        kind: omm-concerns
        source: data-flow
        confidence: intent

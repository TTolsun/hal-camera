# 사이트 설정. tools/docgen/site.mjs 가 읽습니다. yaml-lite 부분집합만 사용합니다.
#
# 원본은 이 디렉터리(guide/)이고 배포 산출물은 docs/ 입니다.
# 페이지는 이 디렉터리 바로 아래의 *.md 와 _inputs/*.md 이며 _layouts/default.html 로 감쌉니다.
# assets/ 와 _inputs/ 의 나머지 파일은 그대로 복사합니다.
# 밑줄로 시작하는 다른 디렉터리(_content, _layouts)와 exclude 목록은 배포하지 않습니다.
title: HALCamera 개발자 가이드
description: Camera HAL 개발자를 위한 HALCamera 앱 가이드
lang: ko

# 배포 대상 경로. 산출물 정리도 이 목록과 매니페스트 안에서만 수행합니다.
output: docs

exclude:
  - _bindings.yaml
  - AGENTS.md

# 상단 메뉴. 경로는 사이트 루트 기준이며 빌더가 페이지 깊이에 맞춰 상대 경로로 바꿉니다.
nav:
  - path: architecture.html
    label: Architecture
  - path: benchmark.html
    label: Benchmark
  - path: probe.html
    label: Probe
  - path: cts.html
    label: CTS
  - path: decisions.html
    label: Decisions
  - path: evidence.html
    label: Evidence
  - path: getting-started.html
    label: 빠른 시작
  - path: troubleshooting.html
    label: 디버깅

# 사이트 설정. 공용 엔진의 `docflow site` 가 읽습니다. yaml-lite 부분집합만 사용합니다.
#
# 원본은 이 디렉터리(guide/)이고 배포 산출물은 docs/ 입니다.
# 페이지는 이 디렉터리 바로 아래의 *.md 와 _inputs/*.md 이며 _layouts/default.html 로 감쌉니다.
# assets/ 와 _inputs/ 의 나머지 파일은 그대로 복사합니다.
# 밑줄로 시작하는 다른 디렉터리(_content, _layouts)와 exclude 목록은 배포하지 않습니다.
title: HALCamera 사용 가이드
description: Camera HAL 개발자를 위한 촬영·측정·검증 가이드
lang: ko

# 홈이 아닌 페이지 상단의 표지 문구.
page_label: HAL CAMERA / 사용 가이드

# 배포 대상 경로. 산출물 정리도 이 목록과 매니페스트 안에서만 수행합니다.
output: docs

exclude:
  - _bindings.yaml
  - AGENTS.md

# HAL 검증 작업 순서. 내부 구조와 검증 기록은 하단 참고 자료로 연결합니다.
nav:
  - path: getting-started.html
    label: 시작하기
  - path: live.html
    label: Live
  - path: probe.html
    label: Probe
  - path: cts.html
    label: CTS
  - path: benchmark.html
    label: Benchmark
  - path: callback.html
    label: Callback
  - path: automation.html
    label: 자동화
  - path: troubleshooting.html
    label: 문제 찾기

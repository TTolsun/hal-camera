[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halcamera-cli"
version = "0.1.0"
description = "Control HALCamera through an authorized Android Debug Bridge connection"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
halcam = "halcam.cli:main"

[tool.setuptools.packages.find]
include = ["halcam*"]
